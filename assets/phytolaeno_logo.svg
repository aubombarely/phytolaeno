<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#0d1f12"/>
      <stop offset="100%" stop-color="#060e09"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="leafglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textglow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background ────────────────────────────────────────────────── -->
  <circle cx="200" cy="200" r="196" fill="#060a07"/>
  <circle cx="200" cy="200" r="185" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="192" fill="none" stroke="#1a4a20" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="186" fill="none" stroke="#0f2e12" stroke-width="0.6"/>

  <!-- ── Stars (green-tinted) ──────────────────────────────────────── -->
  <g fill="#99cc99" opacity="0.45">
    <circle cx="68"  cy="82"  r="1"/>
    <circle cx="335" cy="68"  r="1.5"/>
    <circle cx="82"  cy="318" r="1"/>
    <circle cx="350" cy="310" r="1.5"/>
    <circle cx="112" cy="358" r="1"/>
    <circle cx="294" cy="363" r="1"/>
    <circle cx="52"  cy="208" r="1"/>
    <circle cx="373" cy="178" r="1"/>
    <circle cx="314" cy="46"  r="1"/>
    <circle cx="150" cy="41"  r="1.5"/>
    <circle cx="40"  cy="148" r="1"/>
    <circle cx="362" cy="248" r="1"/>
    <circle cx="170" cy="368" r="1"/>
    <circle cx="240" cy="35"  r="1"/>
  </g>

  <!-- ── Plant (drawn before book so spine overlaps stem base) ─────── -->

  <!-- Main stem -->
  <path d="M 200,148 C 200,128 197,108 200,85"
        fill="none" stroke="#3dbd6a" stroke-width="3"
        filter="url(#leafglow)"/>

  <!-- Left leaf -->
  <path d="M 200,112 C 183,99 169,87 174,74 C 178,61 194,68 200,90 Z"
        fill="#2db862" filter="url(#leafglow)" opacity="0.90"/>
  <path d="M 200,112 C 188,97 177,85 174,74"
        fill="none" stroke="#1a8845" stroke-width="0.9" opacity="0.65"/>

  <!-- Right leaf -->
  <path d="M 200,112 C 217,99 231,87 226,74 C 222,61 206,68 200,90 Z"
        fill="#2db862" filter="url(#leafglow)" opacity="0.90"/>
  <path d="M 200,112 C 212,97 223,85 226,74"
        fill="none" stroke="#1a8845" stroke-width="0.9" opacity="0.65"/>

  <!-- Apical bud at stem tip -->
  <circle cx="200" cy="82" r="5.5" fill="#4cdf82"
          filter="url(#leafglow)" opacity="0.88"/>
  <circle cx="192" cy="76" r="3.5" fill="#3dbd6a" opacity="0.72"/>
  <circle cx="208" cy="76" r="3.5" fill="#3dbd6a" opacity="0.72"/>

  <!-- ── Open book — Library of Celaeno ────────────────────────────── -->

  <!-- Left page (outer edge slightly bowed) -->
  <path d="M 137,148 Q 129,182 137,216 L 198,216 L 198,148 Z"
        fill="#172a1e" stroke="#c8a83a" stroke-width="1.3"/>

  <!-- Right page (outer edge slightly bowed) -->
  <path d="M 202,148 L 202,216 L 263,216 Q 271,182 263,148 Z"
        fill="#172a1e" stroke="#c8a83a" stroke-width="1.3"/>

  <!-- Spine (central gold bar) -->
  <line x1="200" y1="148" x2="200" y2="216"
        stroke="#c8a83a" stroke-width="3"/>

  <!-- Top page-curl line -->
  <path d="M 137,148 Q 165,143 200,148 Q 235,143 263,148"
        fill="none" stroke="#c8a83a" stroke-width="1.3"/>

  <!-- Bottom shadow/thickness -->
  <path d="M 137,216 Q 165,220 200,216 Q 235,220 263,216"
        fill="none" stroke="#a08828" stroke-width="1" opacity="0.5"/>

  <!-- Data rows — left page (annotation table lines) -->
  <g stroke="#4caf72" stroke-width="1.2" opacity="0.72">
    <line x1="145" y1="157" x2="186" y2="157"/>  <!-- header -->
    <line x1="145" y1="167" x2="183" y2="167"/>
    <line x1="145" y1="178" x2="188" y2="178"/>
    <line x1="145" y1="189" x2="179" y2="189"/>
    <line x1="145" y1="200" x2="185" y2="200"/>
    <line x1="145" y1="209" x2="181" y2="209"/>
  </g>

  <!-- Data rows — right page -->
  <g stroke="#4caf72" stroke-width="1.2" opacity="0.72">
    <line x1="214" y1="157" x2="255" y2="157"/>  <!-- header -->
    <line x1="214" y1="167" x2="251" y2="167"/>
    <line x1="214" y1="178" x2="257" y2="178"/>
    <line x1="214" y1="189" x2="247" y2="189"/>
    <line x1="214" y1="200" x2="253" y2="200"/>
    <line x1="214" y1="209" x2="249" y2="209"/>
  </g>

  <!-- Header row highlight (slightly brighter) -->
  <line x1="145" y1="157" x2="186" y2="157"
        stroke="#6ad490" stroke-width="1.6" opacity="0.55"/>
  <line x1="214" y1="157" x2="255" y2="157"
        stroke="#6ad490" stroke-width="1.6" opacity="0.55"/>

  <!-- ── BUSCO-style quality bar chart (below book) ─────────────────── -->
  <!-- Represents the annotation QC metrics shown in the portal -->

  <!-- Axis -->
  <line x1="148" y1="244" x2="148" y2="278" stroke="#2a5a30" stroke-width="1"/>
  <line x1="148" y1="278" x2="262" y2="278" stroke="#2a5a30" stroke-width="1"/>

  <!-- Complete (green) -->
  <rect x="148" y="247" width="96" height="7" rx="2.5"
        fill="#3dbd6a" filter="url(#glow)" opacity="0.85"/>
  <!-- Single-copy (slightly darker shade inside, via overlay) -->
  <rect x="148" y="247" width="72" height="7" rx="2.5"
        fill="#2a9a52" opacity="0.45"/>

  <!-- Fragmented (amber) -->
  <rect x="148" y="258" width="30" height="7" rx="2.5"
        fill="#c8a83a" opacity="0.78"/>

  <!-- Missing (muted red-brown) -->
  <rect x="148" y="269" width="14" height="7" rx="2.5"
        fill="#7a4422" opacity="0.70"/>

  <!-- Bar labels -->
  <g font-family="'Courier New', Courier, monospace" font-size="7.5" fill="#4a7a50">
    <text x="248" y="253">complete</text>
    <text x="182" y="264">fragmented</text>
    <text x="166" y="275">missing</text>
  </g>

  <!-- BUSCO label -->
  <text x="148" y="242"
        font-family="'Courier New', Courier, monospace"
        font-size="7.5" fill="#558855" opacity="0.80">BUSCO</text>

  <!-- ── Separator ─────────────────────────────────────────────────── -->
  <line x1="105" y1="294" x2="295" y2="294"
        stroke="#1a3a20" stroke-width="0.8"/>

  <!-- ── Title ─────────────────────────────────────────────────────── -->
  <text x="200" y="319"
        font-family="'Courier New', Courier, monospace"
        font-size="27"
        font-weight="bold"
        fill="#d0f0d0"
        text-anchor="middle"
        letter-spacing="1.5"
        filter="url(#textglow)">Phytolaeno</text>

  <!-- Subtitle -->
  <text x="200" y="341"
        font-family="'Courier New', Courier, monospace"
        font-size="9.5"
        fill="#447744"
        text-anchor="middle"
        letter-spacing="1.2">Plant  ·  Genome  ·  Portal</text>

</svg>
