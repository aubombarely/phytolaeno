<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phytolaeno{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    :root {
      --ph-green:  #2d6a4f;
      --ph-light:  #d8f3dc;
      --ph-mid:    #52b788;
      --ph-dark:   #1b4332;
    }
    body { background: #f8faf8; color: #222; }
    .navbar { background: var(--ph-dark) !important; }
    .navbar-brand { font-weight: 700; letter-spacing: .04em; color: var(--ph-light) !important; }
    .navbar-brand span { color: var(--ph-mid); }
    .nav-link { color: #c8e6c9 !important; }
    .nav-link:hover, .nav-link.active { color: #fff !important; }
    .badge-ph  { background: var(--ph-green); }
    .card-header-ph { background: var(--ph-dark); color: #fff; }
    .btn-ph  { background: var(--ph-green); color: #fff; border: none; }
    .btn-ph:hover { background: var(--ph-mid); color: #fff; }
    .stat-card { border-left: 4px solid var(--ph-green); }
    .stat-number { font-size: 2rem; font-weight: 700; color: var(--ph-dark); }
    table.table th { background: var(--ph-dark); color: #fff; }
    a { color: var(--ph-green); }
    a:hover { color: var(--ph-mid); }
    footer { background: var(--ph-dark); color: #a5d6a7; font-size: .85em; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/"><i class="bi bi-archive-fill me-1"></i>Phyto<span>laeno</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/species"><i class="bi bi-flower1 me-1"></i>Species</a></li>
        <li class="nav-item"><a class="nav-link" href="/plots"><i class="bi bi-bar-chart-line me-1"></i>Plots</a></li>
        <li class="nav-item"><a class="nav-link" href="/upload"><i class="bi bi-cloud-upload me-1"></i>Upload</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">
  {% block content %}{% endblock %}
</div>

<footer class="mt-5 py-3 text-center">
  <em>Phytolaeno</em> — Plant Genome Annotation Archive &nbsp;|&nbsp;
  <i class="bi bi-archive"></i> Named after the Library of Celaeno
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
