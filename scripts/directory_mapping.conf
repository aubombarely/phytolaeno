# directory_mapping.conf — version/identifier strings used by migrate_to_v2.py
# when building destination directory names.
#
# Tool version values are embedded in directory names, e.g.:
#   quast_version = v5.2.0  ->  01_QUAST_v5.2.0_Run01
#
# figshare_doi is the Figshare DOI or short identifier for the deposited
# annotation, e.g.:
#   figshare_doi = 10.6084_m9.figshare.12986237  ->  00_FigshareAnnotation_10.6084_m9.figshare.12986237_Run01

[tool_versions]
quast_version    = v5.2.0
busco_version    = v5.6.1
helixer_version  = v0.3.4
annevo_version   = v2.2
barrnap_version  = v0.9
trnascan_version = v2.0.12
earlgrey_version = v5.1.1
figshare_doi     = v1
